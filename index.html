const iso = d => d.toISOString().slice(0, 10);
const todayISO = () => iso(new Date());
const addDays = (dateStr, n) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return iso(d);
};
const dayName = dateStr => new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", {
  weekday: "short"
});
const dayNum = dateStr => new Date(dateStr + "T00:00:00").getDate();

  weekday: "long",
  month: "long",
  day: "numeric"
});
const weekOf = dateStr => {
  const d = new Date(dateStr + "T00:00:00");
  const wd = (d.getDay() + 6) % 7;
  const monday = addDays(dateStr, -wd);
  return Array.from({
    length: 7
  }, (_, i) => addDays(monday, i));
};

  const log = profile.weightLog || [];
  const cadence = profile.weighCadence === "biweekly" ? 14 : 7;
  const last = log.length ? log[log.length - 1] : null;
  const due = !last || daysBetween(last.date, todayISO()) >= cadence;
  const prev = log.length > 1 ? log[log.length - 2] : null;

    last,
    prev,
    delta,
    cadence
  };
}

async function geminiComplete(prompt, key) {
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(key), {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      contents: [{
        parts: [{
          text: prompt
        }]
      }]
    })
  });
  if (!res.ok) throw new Error("Gemini HTTP " + res.status);
  const data = await res.json();
  const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || [];

}
